<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bridlington Gold Radio</title>
    
    <!-- PWA Mobile Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#ffffff">
    
    <style>
        :root {
            --bg-color: #ffffff;
            /* Premium frosted transparent white card background styling rules */
            --card-bg: rgba(255, 255, 255, 0.85);
            /* Custom blue typography branding assignment */
            --accent-color: #0329fd; 
            --text-main: #0329fd;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            /* Your custom background wallpaper remains permanently locked in place */
            background: url('assets/bgr-background.png') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Frosted glass style card overlaying the background image */
        .player-container {
            background-color: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 25px 25px 30px 25px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 350px;
            text-align: center;
            /* Custom blue framing boundary outline ring */
            border: 2px solid var(--accent-color);
            position: relative;
        }

        /* HEADER LOGO POSITIONING: Locked at the absolute top of the player card */
        .station-art-header {
            width: 160px;
            height: 160px;
            margin: 0 auto 15px auto;
            border-radius: 12px;
            background-color: transparent;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .station-art-header img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .station-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        .now-playing {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 25px;
            height: 20px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        /* BLUE OUTLINE CIRCLE: Crisp white background with blue ring */
        .btn-play {
            background-color: #ffffff;
            color: var(--accent-color);
            width: 76px;
            height: 76px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(3, 41, 253, 0.2);
            border: 3px solid var(--accent-color);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-play:hover {
            transform: scale(1.06);
            box-shadow: 0 6px 20px rgba(3, 41, 253, 0.3);
        }

        /* BLUE TRIANGLE PLAY ICON: High visibility shape markers */
        .btn-play svg {
            width: 32px;
            height: 32px;
            fill: var(--accent-color);
            margin-left: 4px; /* Centers the moving triangle visually */
        }

        /* SMALLER WIDGET LOGO: Positioned under the controls block */
        .station-art-footer {
            width: 100px;
            height: 54px;
            margin: 15px auto 0 auto;
            border-radius: 6px;
            box-shadow: 0 0 0 3px var(--accent-color), 0 0 6px rgba(0,0,0,0.1);
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .station-art-footer img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* HIDDEN WIDGET CONTAINER: Keeps OnlineRadioBox completely invisible behind your design */
        .hidden-widget-box {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            overflow: hidden;
            pointer-events: none;
            bottom: 0;
            left: 0;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- 1. HEADER STATION LOGO (AT THE TOP) -->
        <div class="station-art-header">
            <img src="assets/BGR-Logo.png" alt="Bridlington Gold Main Logo">
        </div>

        <!-- Station Typography Metadata -->
        <div class="station-name">Bridlington Gold</div>
        <div class="now-playing" id="trackInfo">Live Stream</div>

        <!-- 2. CONTROLS (WHITE CIRCLE, BLUE OUTLINE, BLUE TRIANGLE) -->
        <div class="controls">
            <button class="btn-play" id="customPlayBtn" aria-label="Play">
                <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
        </div>

        <!-- 3. SMALLER WIDGET LOGO (UNDERNEATH CONTROLS) -->
        <div class="station-art-footer">
            <img src="assets/BGR-Logo.png" alt="Bridlington Gold Widget Logo">
        </div>

        <!-- HIDDEN PIPELINE ENGINE LAYER: RUNS YOUR APPROVED WEBSITE WIDGET IN THE BACKGROUND -->
        <div class="hidden-widget-box">
            <div class="orbP" id="orb_player_26bbf4ab2ff58dc4" vlm="0.8">
                <audio id="orb_player_26bbf4ab2ff58dc4_p" crossorigin="true"></audio>
                <button class="orbPp" id="hiddenRealBtn" country="uk" alias="bridlingtongold" stream="1" autoplay="autoplay"></button>
            </div>
        </div>
    </div>

    <!-- Active Script Initialization Engines -->
    <script>
        // OnlineRadioBox Background Initialization Pipeline
        var orbp_w = orbp_w || { lang: "en-us" };
        orbp_w.cmd = orbp_w.cmd || [];
        orbp_w.apiUrl = "https://onlineradiobox.com";
        orbp_w.cmd.push(function() {
            orbp_w.init("orb_player_26bbf4ab2ff58dc4");
        });
        
        var s = document.createElement('script');
        s.src = "https://onlineradiobox.com";
        document.body.appendChild(s);

        // REMOTE CONTROL BRIDGE: Maps your beautiful blue play button to click the unblockable button
        const playBtn = document.getElementById('customPlayBtn');
        const playIcon = document.getElementById('playIcon');
        const hiddenRealBtn = document.getElementById('hiddenRealBtn');

        const playPath = "M8 5v14l11-7z";
        const pausePath = "M6 19h4V5H6v14zm8-14v14h4V5h-4z";
        let isPlaying = false;

        playBtn.addEventListener('click', () => {
            // Remotely click the whitelisted background button engine
            hiddenRealBtn.click();
            
            if (!isPlaying) {
                playIcon.innerHTML = `<path d="${pausePath}"/>`;
                playIcon.style.marginLeft = "0px"; // Centers pause parallel lines perfectly
                isPlaying = true;
            } else {
                playIcon.innerHTML = `<path d="${playPath}"/>`;
                playIcon.style.marginLeft = "4px"; // Centers play triangle visually
                isPlaying = false;
            }
        });

        // Dynamic Manifest Link Injector for Android/iOS PWA Home Screen features
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = './manifest.json';
        document.head.appendChild(link);
    </script>
</body>
</html>
