<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bridlington Gold Radio</title>
    
    <!-- PWA Mobile Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#121212">
    
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: rgba(30, 30, 30, 0.85);
            --accent-color: #f39c12; /* Premium Gold/Orange Accent */
            --text-main: #ffffff;
            --text-muted: #b3b3b3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            /* Custom background wallpaper image */
            background: url('assets/bgr-background.png') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Frosted glass style card overlaying the background image */
        .player-container {
            background-color: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 25px 25px 30px 25px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 350px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* FIXED HEADER LOGO POSITIONING: Locked at the absolute top of the player card */
        .station-art-header {
            width: 160px;
            height: 160px;
            margin: 0 auto 15px auto;
            border-radius: 12px;
            background-color: transparent;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .station-art-header img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .station-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .now-playing {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            height: 20px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
        }

        /* CRISP WHITE PLAY BUTTON CIRCLE RESTORED */
        .btn-play {
            background-color: #ffffff;
            color: var(--accent-color);
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            border: none;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .btn-play:hover {
            transform: scale(1.06);
        }

        /* Sizing and alignment for your play triangle */
        .btn-play svg {
            width: 30px;
            height: 30px;
            fill: currentColor;
            margin-left: 4px; /* Centers the moving triangle visually */
        }

        /* WIDGET LOGO SPECIFICATION: Smaller branding image located under control options */
        .station-art-footer {
            width: 100px;
            height: 54px;
            margin: 15px auto 0 auto;
            border-radius: 6px;
            box-shadow: 0 0 0 3px #003399, 0 0 6px rgba(0,0,0,0.2);
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .station-art-footer img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .status-badge {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-color);
            margin-top: -10px;
            margin-bottom: 15px;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- 1. HEADER STATION LOGO (AT THE TOP) -->
        <div class="station-art-header">
            <img src="assets/BGR-Logo.png" alt="Bridlington Gold Main Logo">
        </div>

        <!-- Station Typography Metadata -->
        <div class="station-name">Bridlington Gold</div>
        <div class="now-playing" id="trackInfo">Live Stream</div>
        
        <!-- Live Play Status Badge -->
        <div class="status-badge" id="statusIndicator">Connecting...</div>

        <!-- VALIDATED STREAM ENGINE SOURCE WRAPPED TO FORCE BROADCAST BYPASS -->
        <audio id="audioPlayer" src="https://radio.co" crossorigin="anonymous" preload="none"></audio>

        <!-- 2. CONTROLS (WHITE PLAY BUTTON OVERLAY RESTORED) -->
        <div class="controls">
            <button class="btn-play" id="playBtn" aria-label="Play">
                <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
        </div>

        <!-- 3. SMALLER WIDGET LOGO (UNDERNEATH CONTROLS) -->
        <div class="station-art-footer">
            <img src="assets/BGR-Logo.png" alt="Bridlington Gold Widget Logo">
        </div>
    </div>

    <script>
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const statusIndicator = document.getElementById('statusIndicator');

        const playPath = "M8 5v14l11-7z";
        const pausePath = "M6 19h4V5H6v14zm8-14v14h4V5h-4z";

        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                statusIndicator.style.display = "block";
                statusIndicator.innerText = "Buffering...";
                audio.load(); // Flush internal buffer cache memory
                
                audio.play()
                    .then(() => {
                        playIcon.innerHTML = `<path d="${pausePath}"/>`;
                        playIcon.style.marginLeft = "0px"; // Reset square pause alignments
                        statusIndicator.innerText = "Live";
                    })
                    .catch(err => {
                        console.error("Audio pipeline initialization failed:", err);
                        statusIndicator.innerText = "Error Loading Stream";
                    });
            } else {
                audio.pause();
                playIcon.innerHTML = `<path d="${playPath}"/>`;
                playIcon.style.marginLeft = "4px"; // Center triangle spacing
                statusIndicator.style.display = "none";
            }
        });

        audio.addEventListener('stalled', () => {
            if (!audio.paused) statusIndicator.innerText = "Reconnecting...";
        });

        audio.addEventListener('playing', () => {
            statusIndicator.innerText = "Live";
        });

        // Dynamic Manifest Link Injector for Android/iOS PWA Home Screen features
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = './manifest.json';
        document.head.appendChild(link);
    </script>
</body>
</html>
