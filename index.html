        :root {

            --accent-color: #0329fd;

        * {

            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {

            background: url('assets/bgr-background.png') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Frosted glass style card overlaying the background image */
        .player-container {
            background-color: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 25px 25px 30px 25px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 350px;
            text-align: center;
            /* Custom blue framing boundary outline ring */
            border: 2px solid var(--accent-color);
            position: relative;
        }

        /* HEADER LOGO POSITIONING: Locked at the absolute top of the player card */
        .station-art-header {
            width: 160px;
            height: 160px;
            margin: 0 auto 15px auto;
            border-radius: 12px;
            background-color: transparent;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .station-art-header img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .station-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        .now-playing {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 25px;
            height: 20px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* CONTROL CAP: Stacks your visual buttons perfectly on top of the hidden widget stream trigger */
        .controls-stack {
            position: relative;
            width: 76px;
            height: 76px;
            margin: 0 auto 20px auto;
        }

        /* BLUE OUTLINE CIRCLE: Crisp white background with blue ring */
        .btn-play {
            background-color: #ffffff;
            color: var(--accent-color);
            width: 76px;
            height: 76px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(3, 41, 253, 0.2);
            border: 3px solid var(--accent-color);
            cursor: pointer;
            transition: transform 0.2s ease;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            pointer-events: none; /* Passes the actual user finger tap down to the layer below */
        }

        /* BLUE TRIANGLE PLAY ICON: High visibility shape markers */
        .btn-play svg {
            width: 32px;
            height: 32px;
            fill: var(--accent-color);
            margin-left: 4px; /* Centers the moving triangle visually */
        }

        /* SMALLER WIDGET LOGO: Positioned under the controls block */
        .station-art-footer {
            width: 100px;
            height: 54px;
            margin: 15px auto 0 auto;
            border-radius: 6px;
            box-shadow: 0 0 0 3px var(--accent-color), 0 0 6px rgba(0,0,0,0.1);
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .station-art-footer img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 🛠️ WIDGET ENGINE STYLE STRIPPER: Completely hides all the raw, ugly text/links from the background script */
        .orbP {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 76px !important;
            height: 76px !important;
            margin: 0 !important;
            padding: 0 !important;
            border: none !important;
            background: transparent !important;
            z-index: 20 !important; /* Forces it above your design so the browser registers the touch */
            overflow: hidden !important;
        }

        /* Completely stretches their hidden play trigger box over your clean blue play triangle button */
        .orbPp {
            width: 76px !important;
            height: 76px !important;
            border-radius: 50% !important;
            opacity: 0.001 !important; /* Invisible to the user but fully active to the screen */
            cursor: pointer !important;
            background: black !important;
            border: none !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        /* Hides all fallback text markers and cross-linking layout frames */
        .orbPhc, .orbPt, .orbPh, .orbPti, .orbPtn, .orbPtt {
            display: none !important;
            opacity: 0 !important;
            width: 0px !important;
            height: 0px !important;
        }
    </style>
</head>
