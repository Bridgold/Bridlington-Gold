<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bridlington Gold Radio</title>
    <!-- PWA Mobile Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#ffffff">
    <style>
        :root { --card-bg: rgba(255, 255, 255, 0.85); --accent-color: #0329fd; --text-main: #0329fd; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: url('assets/bgr-background.png') no-repeat center fixed; background-size: cover; color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .player-container { background-color: var(--card-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 25px; border-radius: 20px; border: 2px solid var(--accent-color); text-align: center; width: 100%; max-width: 350px; position: relative; }
        .station-art-header { width: 160px; height: 160px; margin: 0 auto 15px auto; }
        .station-art-header img { width: 100%; height: 100%; object-fit: contain; }
        .station-name { font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; color: var(--text-main); }
        .now-playing { font-size: 0.85rem; font-weight: 600; margin-bottom: 25px; height: 20px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .controls-stack { position: relative; width: 76px; height: 76px; margin: 0 auto 20px auto; }
        .btn-play { background-color: #ffffff; color: var(--accent-color); width: 76px; height: 76px; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: 3px solid var(--accent-color); cursor: pointer; position: absolute; top: 0; left: 0; z-index: 10; pointer-events: none; }
        .btn-play svg { width: 32px; height: 32px; fill: var(--accent-color); margin-left: 4px; }
        .station-art-footer { width: 100px; height: 54px; margin: 15px auto 0 auto; border-radius: 6px; box-shadow: 0 0 0 3px var(--accent-color); background: #000; overflow: hidden; }
        .station-art-footer img { width: 100%; height: 100%; object-fit: contain; }
        div#orb_player_26bbf4ab2ff58dc4.orbP { position: absolute !important; top: 0 !important; left: 0 !important; width: 76px !important; height: 76px !important; border: none !important; background: transparent !important; z-index: 20 !important; overflow: hidden !important; }
        #orb_player_26bbf4ab2ff58dc4 .orbPp { width: 76px !important; height: 76px !important; border-radius: 50% !important; opacity: 0.001 !important; cursor: pointer !important; background: black !important; border: none !important; }
        #orb_player_26bbf4ab2ff58dc4 .orbPhc, #orb_player_26bbf4ab2ff58dc4 .orbPt, #orb_player_26bbf4ab2ff58dc4 .orbPh, #orb_player_26bbf4ab2ff58dc4 .orbPti, #orb_player_26bbf4ab2ff58dc4 .orbPtn, #orb_player_26bbf4ab2ff58dc4 .orbPtt { display: none !important; opacity: 0 !important; width: 0px !important; height: 0px !important; }
    </style>
</head>
<body>
    <div class="player-container">
        <div class="station-art-header"><img src="assets/BGR-Logo.png" alt="Logo"></div>
        <div class="station-name">Bridlington Gold</div>
        <div class="now-playing" id="trackInfo">Live Stream</div>
        <div class="controls-stack">
            <button class="btn-play" id="visualPlayBtn"><svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
            <div class="orbP" id="orb_player_26bbf4ab2ff58dc4" vlm="0.8">
                <audio id="orb_player_26bbf4ab2ff58dc4_p" crossorigin="true" style="display:none;"></audio>
                <button class="orbPp" id="actualHiddenBtn" country="uk" alias="bridlingtongold" stream="1"></button>
            </div>
        </div>
        <div class="station-art-footer"><img src="assets/BGR-Logo.png" alt="Logo"></div>
    </div>
    <script>
        var orbp_w = orbp_w || { lang: "en-us" }; orbp_w.cmd = orbp_w.cmd || []; orbp_w.apiUrl = "https://onlineradiobox.com";
        orbp_w.cmd.push(function() { orbp_w.init("orb_player_26bbf4ab2ff58dc4"); });
        var s = document.createElement('script'); s.src = "https://onlineradiobox.com"; document.body.appendChild(s);
        const playIcon = document.getElementById('playIcon'); const actualHiddenBtn = document.getElementById('actualHiddenBtn'); const trackInfo = document.getElementById('trackInfo');
        const playPath = "M8 5v14l11-7z"; const pausePath = "M6 19h4V5H6v14zm8-14v14h4V5h-4z";
        function updateLiveMetadata() {
            fetch('https://onlineradiobox.com').then(r => r.json()).then(d => { if (d && d.title) { trackInfo.innerText = d.title; } }).catch(e => console.log("Metadata active"));
        }
        updateLiveMetadata(); setInterval(updateLiveMetadata, 12000);
        actualHiddenBtn.addEventListener('click', () => {
            setTimeout(() => {
                const streamIsActive = actualHiddenBtn.classList.contains('orbPs') || actualHiddenBtn.classList.contains('playing') || !document.getElementById('orb_player_26bbf4ab2ff58dc4_p').paused;
                if (streamIsActive || actualHiddenBtn.title === "Stop") { playIcon.innerHTML = `<path d="${pausePath}"/>`; playIcon.style.marginLeft = "0px"; updateLiveMetadata(); }
                else { playIcon.innerHTML = `<path d="${playPath}"/>`; playIcon.style.marginLeft = "4px"; }
            }, 350);
        });
        const link = document.createElement('link'); link.rel = 'manifest'; link.href = './manifest.json'; document.head.appendChild(link);
    </script>
</body>
</html>
