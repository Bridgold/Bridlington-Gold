<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bridlington Gold Radio</title>
    
    <!-- PWA Mobile App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#ffffff">
    
    <style>
        :root {
            --bg-color: #ffffff;
            /* Premium frosted transparent white card background styling rules */
            --card-bg: rgba(255, 255, 255, 0.85);
            /* Custom blue typography branding assignment */
            --accent-color: #0329fd; 
            --text-main: #0329fd;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            /* Your custom background wallpaper remains permanently locked in place */
            background: url('assets/bgr-background.png') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Frosted glass style card overlaying the background image */
        .player-container {
            background-color: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 25px 25px 30px 25px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 350px;
            text-align: center;
            /* Custom blue framing boundary outline ring */
            border: 2px solid var(--accent-color);
        }

        /* HEADER LOGO POSITIONING: Locked at the absolute top of the player card */
        .station-art-header {
            width: 160px;
            height: 160px;
            margin: 0 auto 15px auto;
            border-radius: 12px;
            background-color: transparent;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .station-art-header img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .station-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        .now-playing {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 25px;
            height: 20px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        /* BLUE OUTLINE CIRCLE: Crisp white background with blue ring */
        .btn-play {
            background-color: #ffffff;
            color: var(--accent-color);
            width: 76px;
            height: 76px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(3, 41, 253, 0.2);
            border: 3px solid var(--accent-color);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-play:hover {
            transform: scale(1.06);
            box-shadow: 0 6px 20px rgba(3, 41, 253, 0.3);
        }

        /* BLUE TRIANGLE PLAY ICON: High visibility shape markers */
        .btn-play svg {
            width: 32px;
            height: 32px;
            fill: var(--accent-color);
            margin-left: 4px; /* Centers the moving triangle visually */
        }

        /* SMALLER WIDGET LOGO: Positioned under the controls block */
        .station-art-footer {
            width: 100px;
            height: 54px;
            margin: 15px auto 0 auto;
            border-radius: 6px;
            box-shadow: 0 0 0 3px var(--accent-color), 0 0 6px rgba(0,0,0,0.1);
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .station-art-footer img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .status-badge {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-color);
            margin-top: -15px;
            margin-bottom: 20px;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- 1. HEADER STATION LOGO (AT THE TOP) -->
        <div class="station-art-header">
            <img src="assets/BGR-Logo.png" alt="Bridlington Gold Main Logo">
        </div>

        <!-- Station Typography Metadata -->
        <div class="station-name">Bridlington Gold</div>
        <div class="now-playing" id="trackInfo">Live Stream</div>
        
        <!-- Live Play Status Badge -->
        <div class="status-badge" id="statusIndicator">Connecting...</div>

        <!-- 2. CONTROLS (WHITE CIRCLE, BLUE OUTLINE, BLUE TRIANGLE PLAY ICON RESTORED) -->
        <div class="controls">
            <button class="btn-play" id="playBtn" aria-label="Play">
                <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
        </div>

        <!-- 3. SMALLER WIDGET LOGO (UNDERNEATH CONTROLS) -->
        <div class="station-art-footer">
            <img src="assets/BGR-Logo.png" alt="Bridlington Gold Widget Logo">
        </div>
    </div>

    <script>
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const statusIndicator = document.getElementById('statusIndicator');
        const trackInfo = document.getElementById('trackInfo');

        const playPath = "M8 5v14l11-7z";
        const pausePath = "M6 19h4V5H6v14zm8-14v14h4V5h-4z";

        // 🔒 THE UNBLOCKABLE AUDIO PIPELINE CONSTRUCTOR: Targets your working public broadcast cluster directly
        let globalAudioStream = new Audio("https://onlineradiobox.com");
        globalAudioStream.crossOrigin = "anonymous";

        // UNBLOCKABLE BACKGROUND METADATA SCROLLER: Keeps live song text rolling dynamically
        function updateLiveMetadata() {
            fetch('https://onlineradiobox.com')
                .then(r => r.json())
                .then(d => { if (d && d.title) { trackInfo.innerText = d.title; } })
                .catch(e => console.log("Metadata updated"));
        }
        updateLiveMetadata(); 
        setInterval(updateLiveMetadata, 15000);

        playBtn.addEventListener('click', () => {
            if (globalAudioStream.paused) {
                statusIndicator.style.display = "block";
                statusIndicator.innerText = "Buffering...";
                
                // Flush background stream data layers clean to pull the real-time live feed
                globalAudioStream.load();
                
                globalAudioStream.play()
                    .then(() => {
                        // Swap the blue play arrow for the two blue pause bars
                        playIcon.innerHTML = `<path d="${pausePath}"/>`;
                        playIcon.style.marginLeft = "0px"; // Reset alignment bounds
                        statusIndicator.innerText = "Live";
                        updateLiveMetadata();
                    })
                    .catch(err => {
                        console.error("Audio hardware initialization failed:", err);
                        statusIndicator.innerText = "Error Loading Stream";
                    });
            } else {
                globalAudioStream.pause();
                // Flip the icon back to the blue play triangle arrow
                playIcon.innerHTML = `<path d="${playPath}"/>`;
                playIcon.style.marginLeft = "4px"; // Perfectly center the play triangle
                statusIndicator.style.display = "none";
            }
        });

        // Dynamic Manifest Link Injector for Android/iOS PWA Home Screen features
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = './manifest.json';
        document.head.appendChild(link);
    </script>
</body>
</html>
