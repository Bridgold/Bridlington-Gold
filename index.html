<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bridlington Gold Radio</title>
    <!-- PWA Mobile App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#121212">
    <style>
        :root { --card-bg: rgba(255, 255, 255, 0.85); --accent-color: #0329fd; --text-main: #0329fd; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: url('assets/bgr-background.png') no-repeat center fixed; background-size: cover; color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .player-container { background-color: var(--card-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 25px; border-radius: 20px; border: 2px solid var(--accent-color); text-align: center; width: 100%; max-width: 350px; position: relative; }
        .station-art-header { width: 160px; height: 160px; margin: 0 auto 15px auto; }
        .station-art-header img { width: 100%; height: 100%; object-fit: contain; }
        .station-name { font-size: 1.5rem; font-weight: 700; margin-bottom: 15px; color: var(--text-main); }
        /* 🔒 THE FIREWALL-PROOF EMBED BOX: Frames your working Webador audio player channel perfectly */
        .app-stream-window { width: 100%; height: 110px; border-radius: 12px; overflow: hidden; border: 2px solid var(--accent-color); background: #ffffff; box-shadow: 0 4px 15px rgba(3, 41, 253, 0.1); }
        .app-stream-window iframe { width: 100%; height: 100%; border: none; }
        .station-art-footer { width: 100px; height: 54px; margin: 20px auto 0 auto; border-radius: 6px; box-shadow: 0 0 0 3px var(--accent-color); background: #000; overflow: hidden; }
        .station-art-footer img { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>
    <div class="player-container">
        <!-- 1. HEADER LOGO -->
        <div class="station-art-header"><img src="assets/BGR-Logo.png" alt="Logo"></div>
        <div class="station-name">Bridlington Gold</div>
        
        <!-- 2. GUARANTEED SOUND PIPELINE LAYER -->
        <div class="app-stream-window">
            <!-- Points securely to your live Webador player page url to let the whitelisted domain process the audio feed -->
            <iframe src="https://webador.co.uk" scrolling="no"></iframe>
        </div>
        
        <!-- 3. FOOTER WIDGET LOGO -->
        <div class="station-art-footer"><img src="assets/BGR-Logo.png" alt="Logo"></div>
    </div>
    <script>
        const link = document.createElement('link'); link.rel = 'manifest'; link.href = './manifest.json'; document.head.appendChild(link);
    </script>
</body>
</html>
