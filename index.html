<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bridlington Gold Radio</title>
    
    <!-- PWA Mobile Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#ffffff">
    
    <!-- CRITICAL DEPENDENCY: INJECTING RADIO.CO OFFICIAL LIBARY ENGINE -->
    <script src="https://radio.co"></script>
    
    <style>
        :root {
            --bg-color: #ffffff;
            /* Premium frosted transparent white card background styling rules */
            --card-bg: rgba(255, 255, 255, 0.85);
            /* Custom blue typography branding assignment */
            --accent-color: #0329fd; 
            --text-main: #0329fd;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            /* Your custom background wallpaper remains permanently locked in place */
            background: url('assets/bgr-background.png') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Frosted glass style card overlaying the background image */
        .player-container {
            background-color: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 25px 25px 30px 25px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 350px;
            text-align: center;
            /* Custom blue framing boundary outline ring */
            border: 2px solid var(--accent-color);
            position: relative;
        }

        /* HEADER LOGO POSITIONING: Locked at the absolute top of the player card */
        .station-art-header {
            width: 160px;
            height: 160px;
            margin: 0 auto 15px auto;
            border-radius: 12px;
            background-color: transparent;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .station-art-header img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .station-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        .now-playing {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 25px;
            height: 20px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* CONTROL CAP: Stacks your visual buttons perfectly on top of the hidden stream trigger */
        .controls-stack {
            position: relative;
            width: 76px;
            height: 76px;
            margin: 0 auto 20px auto;
        }

        /* BLUE OUTLINE CIRCLE: Crisp white background with blue ring */
        .btn-play {
            background-color: #ffffff;
            color: var(--accent-color);
            width: 76px;
            height: 76px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(3, 41, 253, 0.2);
            border: 3px solid var(--accent-color);
            cursor: pointer;
            transition: transform 0.2s ease;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            pointer-events: none; /* Passes the actual user finger tap down to the layer below */
        }

        /* BLUE TRIANGLE PLAY ICON: High visibility shape markers */
        .btn-play svg {
            width: 32px;
            height: 32px;
            fill: var(--accent-color);
            margin-left: 4px; /* Centers the moving triangle visually */
        }

        /* INVISIBLE TUNNEL ENFORCER BUTTON: Radio.co's actual whitelisted button element stretched out underneath */
        .radioco-playButton {
            width: 76px !important;
            height: 76px !important;
            border-radius: 50% !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            opacity: 0.01 !important; /* Kept completely invisible to the eye */
            z-index: 20 !important;   /* Places it on top so the browser reads the direct tap */
            cursor: pointer !important;
            background: black !important;
            border: none !important;
        }

        /* SMALLER WIDGET LOGO: Positioned under the controls block */
        .station-art-footer {
            width: 100px;
            height: 54px;
            margin: 15px auto 0 auto;
            border-radius: 6px;
            box-shadow: 0 0 0 3px var(--accent-color), 0 0 6px rgba(0,0,0,0.1);
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .station-art-footer img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- 1. HEADER STATION LOGO (AT THE TOP) -->
        <div class="station-art-header">
            <img src="assets/BGR-Logo.png" alt="Bridlington Gold Main Logo">
        </div>

        <!-- Station Typography Metadata -->
        <div class="station-name">Bridlington Gold</div>
        
        <!-- Live track names are auto-fed into this specific span class by Radio.co's SDK layer -->
        <div class="now-playing"><span class="radioco-nowplaying">Live Stream</span></div>
        
        <!-- 2. CONTROLS CONTAINER SYSTEM -->
        <div class="controls-stack">
            <!-- Visual Layer: Your gorgeous white circle and blue triangle play button design -->
            <button class="btn-play" id="visualPlayBtn" aria-label="Play">
                <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>

            <!-- Action Layer: Radio.co's official button hook, hidden right under the finger target -->
            <button class="radioco-playButton" id="actualHiddenBtn"></button>
        </div>

        <!-- 3. SMALLER WIDGET LOGO (UNDERNEATH CONTROLS) -->
        <div class="station-art-footer">
            <img src="assets/BGR-Logo.png" alt="Bridlington Gold Widget Logo">
        </div>
    </div>

    <script>
        const playIcon = document.getElementById('playIcon');
        const actualHiddenBtn = document.getElementById('actualHiddenBtn');

        const playPath = "M8 5v14l11-7z";
        const pausePath = "M6 19h4V5H6v14zm8-14v14h4V5h-4z";

        // INITIALIZE THE OFFICIAL AUTHORIZED RADIO.CO WEB SDK ENGINE 
        // This opens a secure, whitelisted tunnel connection using your station token profile
        const playerEngine = new RadioCoPlayer('.player-container', {
            station: 's837138072',
            autoplay: false
        });

        // Watch the hidden engine layer and update your visible blue icons automatically when it shifts states
        actualHiddenBtn.addEventListener('click', () => {
            setTimeout(() => {
                const streamIsActive = actualHiddenBtn.classList.contains('radioco-playing');
                
                if (streamIsActive) {
                    // Update your visible icon to the blue pause bars
                    playIcon.innerHTML = `<path d="${pausePath}"/>`;
                    playIcon.style.marginLeft = "0px";
                } else {
                    // Return your visible icon back to the blue play triangle
                    playIcon.innerHTML = `<path d="${playPath}"/>`;
                    playIcon.style.marginLeft = "4px";
                }
            }, 300); // Give the background script half a heartbeat to register the connection state toggle
        });

        // Dynamic Manifest Link Injector for Android/iOS PWA Home Screen features
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = './manifest.json';
        document.head.appendChild(link);
    </script>
</body>
</html>
