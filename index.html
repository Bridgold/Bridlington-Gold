<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bridlington Gold Radio</title>
    
    <!-- PWA Mobile App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#ffffff">
    
    <style>
        :root {
            --bg-color: #ffffff;
            /* Premium frosted transparent white card background styling rules */
            --card-bg: rgba(255, 255, 255, 0.85);
            /* Custom blue typography branding assignment */
            --accent-color: #0329fd; 
            --text-main: #0329fd;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            /* Your custom background wallpaper remains permanently locked in place */
            background: url('assets/bgr-background.png') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Frosted glass style card overlaying the background image */
        .player-container {
            background-color: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 25px 25px 30px 25px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 350px;
            text-align: center;
            /* Custom blue framing boundary outline ring */
            border: 2px solid var(--accent-color);
        }

        /* HEADER LOGO POSITIONING: Locked at the absolute top of the player card */
        .station-art-header {
            width: 160px;
            height: 160px;
            margin: 0 auto 15px auto;
            border-radius: 12px;
            background-color: transparent;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .station-art-header img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .station-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        /* 🔒 THE FIREWALL-PROOF WINDOW CONTAINER: Stretches and centers the whitelisted stream engine cleanly */
        .stream-frame-container {
            width: 100%;
            height: 125px;
            margin: 0 auto;
            border-radius: 15px;
            overflow: hidden;
            background: #ffffff;
            box-shadow: 0 4px 15px rgba(3, 41, 253, 0.1);
            border: 2px solid var(--accent-color);
        }

        .stream-frame-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* SMALLER WIDGET LOGO: Positioned directly underneath the player frame layout block */
        .station-art-footer {
            width: 100px;
            height: 54px;
            margin: 20px auto 0 auto;
            border-radius: 6px;
            box-shadow: 0 0 0 3px var(--accent-color), 0 0 6px rgba(0,0,0,0.1);
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .station-art-footer img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- 1. HEADER STATION LOGO (AT THE TOP) -->
        <div class="station-art-header">
            <img src="assets/BGR-Logo.png" alt="Bridlington Gold Main Logo">
        </div>

        <!-- Station Typography Metadata -->
        <div class="station-name">Bridlington Gold Radio</div>
        
        <!-- 2. OFFICIAL UNBLOCKABLE WEB WRAPPER TUNNEL ELEMENT WITH EMBEDDED CONTROLS ACTIVATED -->
        <div class="stream-frame-container">
            <!-- Style parameter forces an immediate responsive playback button configuration layout -->
            <iframe src="https://radio.co" scrolling="no"></iframe>
        </div>

        <!-- 3. SMALLER WIDGET LOGO (UNDERNEATH THE STREAM CONTROLS) -->
        <div class="station-art-footer">
            <img src="assets/BGR-Logo.png" alt="Bridlington Gold Widget Logo">
        </div>
    </div>

    <script>
        // Dynamic Manifest Link Injector for Android/iOS PWA Home Screen features
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = './manifest.json';
        document.head.appendChild(link);
    </script>
</body>
</html>
