<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bridlington Gold Radio</title>
    
    <!-- PWA Mobile Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#ffffff">
    
    <style>
        :root {
            --bg-color: #ffffff;
            /* TRANSFORMED: Frosted, semi-transparent premium white layout card background */
            --card-bg: rgba(255, 255, 255, 0.85);
            /* TRANSFORMED: Deep vibrant blue typography anchor style color assignment */
            --accent-color: #0329fd; 
            --text-main: #0329fd;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            /* Custom background wallpaper image remains locked in place */
            background: url('assets/bgr-background.png') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Frosted glass style card overlaying the background image */
        .player-container {
            background-color: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 350px;
            text-align: center;
            /* TRANSFORMED: Custom deep blue border outline wrapping the glass card */
            border: 2px solid var(--accent-color);
        }

        /* HEADER LOGO POSITIONING: Locked at the absolute top of the player card */
        .station-art-header {
            width: 160px;
            height: 160px;
            margin: 0 auto 15px auto;
            border-radius: 12px;
            background-color: transparent;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .station-art-header img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .station-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            /* TRANSFORMED: Explicitly set text header coloration parameters */
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        /* SECURE EMBED FRAME WRAPPER: Contains the native unblockable media elements */
        .stream-frame-container {
            width: 100%;
            height: 90px;
            margin: 0 auto;
            border-radius: 50px; /* Rounded pill style layout boundary */
            overflow: hidden;
            background: #ffffff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            /* TRANSFORMED: Deep blue outline wrapping around the visual player circle layout */
            border: 2px solid var(--accent-color);
        }

        .stream-frame-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* SMALLER WIDGET LOGO: Repositioned directly under the control section */
        .station-art-footer {
            width: 100px;
            height: 54px;
            margin: 20px auto 0 auto;
            border-radius: 6px;
            /* Custom blue framing ring logic matching website component specs */
            box-shadow: 0 0 0 3px var(--accent-color), 0 0 6px rgba(0,0,0,0.1);
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .station-art-footer img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- 1. HEADER STATION LOGO (AT THE TOP) -->
        <div class="station-art-header">
            <img src="assets/BGR-Logo.png" alt="Bridlington Gold Main Logo">
        </div>

        <!-- Station Typography Metadata -->
        <div class="station-name">Bridlington Gold Radio</div>
        
        <!-- 2. NATIVE UNBLOCKABLE ENGINE EMBED (RESTORES CONTROLS WITH #0329fd PLAY LOGIC ACCENTS) -->
        <div class="stream-frame-container">
            <iframe src="https://radio.co" scrolling="no"></iframe>
        </div>

        <!-- 3. SMALLER WIDGET LOGO (UNDERNEATH THE CONTROLS) -->
        <div class="station-art-footer">
            <img src="assets/BGR-Logo.png" alt="Bridlington Gold Widget Logo">
        </div>
    </div>

    <script>
        // Dynamic Manifest Link Injector for Android/iOS PWA Home Screen capabilities
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = './manifest.json';
        document.head.appendChild(link);
    </script>
</body>
</html>
